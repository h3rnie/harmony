<html lang="en">
  <head>

    <title>Harmony — Two satellites. One fire record.</title>
    <meta name="description" content="Harmony joins MODIS and VIIRS fire detections into one consistent monthly record since 2000, so you can see when any area on Earth burns, which years were extreme, and how this month compares with normal." />
    <meta name="author" content="Toh Yu Heng" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Harmony" />
    <meta property="og:title" content="Harmony — Two satellites. One fire record." />
    <meta property="og:description" content="Twenty-six years of MODIS and VIIRS fire detections, harmonized into one consistent monthly record for any area on Earth." />

    <script>
      // Apply the theme before first paint (no flash).
      (function () {
        var p = null
        try { p = localStorage.getItem('harmony-theme') } catch (e) {}
        var t = p === 'dark' || p === 'light' ? p : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
